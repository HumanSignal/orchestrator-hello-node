[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    expected_red_until_fixed: subject is node.py and it fails today — a written-down defect
    subject_is_platform: subject is the runner/agent/collector, not the node
    harness_self_test: subject is this harness
    conforms_today: subject is node.py and it passes today — a regression guard
