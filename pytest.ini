[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    expected_red_until_fixed: subject is node.py and it fails today
    subject_is_platform: subject is the runner/agent/collector, not the node
    harness_self_test: subject is this harness
    conforms_today: subject is node.py and it passes today — a regression guard
    basis_contract(citation): the rule exists in the platform's sources — the argument quotes it
    basis_reference_quality(rationale): what a reference node should demonstrate; the contract permits otherwise
    basis_our_policy(rationale): a compatibility/hygiene choice this repository makes, which nothing states
